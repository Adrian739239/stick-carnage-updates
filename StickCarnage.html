  if (!G.cfg.stage) return; G.roundT = Math.min(G.roundT, 30); const S = G.st, p = fighters[0], s = stageSec(), foes = fighters.slice(1).filter(f => !f.dead);
  const boss = fighters.find(f => f.boss); if (boss && boss.dead) { stageFinish(true); return; }
  if (p.dead) { S.dead += dt; if (S.dead > 1.6) { S.dead = 0; S.lives--; if (S.lives <= 0) stageFinish(false); else respawnPlayer(); } return; }
  if (boss) bossStep(boss, p, dt);
  if (foes.length) { S.age += dt; if (S.age > 45 && !boss) for (const f of foes) kill(f, null, 0, -1, 'verschwindet'); return; }
  if (S.wave < s[1].length) { S.wait -= dt; if (S.wait <= 0) { for (const c of s[1][S.wave]) spawnEnemy(c); S.wave++; S.wait = 1; S.age = 0; if (s[1].length > 1) E('feed', `Welle ${S.wave} von ${s[1].length}`, '#ffd24a'); } return; }
  if (!S.open) { S.open = true; level.plats.splice(level.plats.indexOf(S.gate), 1); rebuildSolids(); E('sfx', 'go'); E('feed', 'Tor offen: weiter nach rechts!', '#7fe89a'); }
  if (p.x > 1540 && !s.boss) { if (S.sec + 1 < WORLD1[S.lv].secs.length) enterSection(S.sec + 1); else stageFinish(true); }
}
// Der Boss kündigt jeden Angriff an, damit man ausweichen kann.
function bossStep(b, p, dt) {
  const S = G.st; if (!b.rage && b.hp <= b.maxHp / 2) { b.rage = true; b.m = { ...b.m, speed: b.m.speed * 1.25 }; b.setLabel('WUTANFALL!'); E('shake', 12); E('sfx', 'parry', b.x); }
  if (S.calls < 2 && b.hp <= b.maxHp * (S.calls ? .33 : .66)) { S.calls++; spawnEnemy('g'); spawnEnemy('g'); E('feed', 'Der Schlächter ruft Verstärkung!', '#ff7a70'); }
  if (b.leap) { if (b.onGround && S.air) { b.leap = false; S.air = false; b.holdAI = false; S.bossT = b.rage ? 2.2 : 3.4; E('shake', 16); E('sfx', 'boom', b.x); E('ring', b.x, b.y - 8, 300, '#ff5252', .4); E('dust', b.x, b.y, 24); if (Math.abs(p.x - b.x) < 300 && p.onGround) hitFighter(p, 'torso', 32, WEAPONS.hammer, Math.sign(p.x - b.x) || 1, -.6, 900, b); } else if (!b.onGround) { S.air = true; b.vx = S.lvx; } return; }
  if (S.tele > 0) { S.tele -= dt; if (S.tele > 0) return; const dx = p.x - b.x; if (S.atk === 'leap') { b.leap = true; S.air = false; S.lvx = b.vx = clamp(dx, -900, 900); b.vy = -1050; b.onGround = false; b.ground = null; } else { b.holdAI = false; S.bossT = b.rage ? 2 : 3; const a0 = Math.atan2(p.y - 40 - b.y + 60, dx); for (let i = -3; i <= 3; i++) { const a = a0 + i * .16; shots.push({ id: shotId++, k: 'shuriken', x: b.x, y: b.y - 60, vx: Math.cos(a) * 760, vy: Math.sin(a) * 760, dmg: 16, owner: b, w: 'shuriken', life: 4, fuse: 0, hit: new Set(), grav: GRAV * .15, ang: a, spin: 1 }); } E('sfx', 'throw', b.x); } return; }
  S.bossT -= dt; if (S.bossT <= 0) { S.atk = pick(['leap', 'fan']); S.tele = b.rage ? .55 : .8; b.holdAI = true; b.setLabel(S.atk === 'leap' ? 'SPRUNG!' : 'KLINGEN!'); E('sfx', 'beep', b.x); }
}
function drawBossBar() {
  if (!G.cfg || !G.cfg.stage || !G.st) return; const S = G.st, L = WORLD1[S.lv], b = fighters.find(f => f.boss && !f.dead); worldTx(ctx);
  if (S.gate && !S.open) { const t = Math.sin(G.time * 8) * .25 + .75; ctx.strokeStyle = `rgba(255,70,60,${t})`; ctx.lineWidth = 5; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(1500 + i * 18, 0); ctx.lineTo(1500 + i * 18, 900); ctx.stroke(); } }
  if (S.open && !stageSec().boss) { const y = stageSec().map.spawns[0][1] - 120, x = 1500 + Math.sin(G.time * 6) * 14; ctx.fillStyle = '#7fe89a'; ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x + 44, y); ctx.lineTo(x, y + 26); ctx.closePath(); ctx.fill(); }
  if (b && G.st.tele > 0) { ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y - 50, 74, 0, 7); ctx.stroke(); if (S.atk === 'leap') { const p = fighters[0]; ctx.fillStyle = 'rgba(255,60,50,.25)'; ctx.fillRect(p.x - 300, p.y - 6, 600, 8); } }
  uiTx(); text(`${L.n}  ·  ${L.secs.length > 1 ? `Abschnitt ${S.sec + 1}/${L.secs.length}  ·  ` : ''}${'♥'.repeat(Math.max(0, S.lives))}`, 640, 24, `600 16px ${FONT}`, '#fff', 'center', 3);
  if (b) { ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(340, 34, 600, 22); ctx.fillStyle = b.rage ? '#ff3b30' : '#c22'; ctx.fillRect(343, 37, 594 * clamp(b.hp / b.maxHp, 0, 1), 16); text(b.name + (b.rage ? '  ·  WUTANFALL' : ''), 640, 51, `600 14px ${FONT}`, '#fff', 'center'); }
}
function campaignEnd(won) { if (won && G.campI >= campCleared()) { profile.stats.camp = G.campI + 1; saveProfile(); } G.campWon = won; }
function screenCamp() {
  dim(.62); panel(180, 40, 920, 640); text('WELT 1', 210, 96, `44px ${FONT_D}`, '#fff'); text('10 Level und ein Boss', 1070, 90, `600 15px ${FONT}`, UIC.dim, 'right');
  const open = campCleared();
  WORLD1.forEach((c, i) => {
    const boss = i === 10, x = boss ? 210 : 210 + (i % 2) * 435, y = boss ? 494 : 118 + Math.floor(i / 2) * 74, w = boss ? 860 : 425, off = i > open;
    if (btn2(x, y, w, 46, `${boss ? 'BOSS' : i + 1}  ${boss ? c.n.slice(6) : c.n}${i < open ? '  ✓' : ''}`, { size: 18, off, primary: i === open })) { startCamp(i); return; }
    text(off ? 'Noch gesperrt' : c.d, x + 8, y + 62, `13px ${FONT}`, UIC.dim);
  });
  if (open > 10) text('Welt 1 geschafft!', 640, 590, `30px ${FONT_D}`, UIC.gold, 'center');
  if (btn2(930, 620, 140, 42, 'Zurück', { back: 1, size: 18 }) || nav.back) goScreen('title');
}
function campaignResults(y) {
  const next = G.campI + 1 < WORLD1.length; text(G.campWon ? 'Level geschafft!' : 'Alle Leben verloren', 640, y - 16, `600 22px ${FONT}`, G.campWon ? '#7fe89a' : '#ff7a70', 'center');
  if (btn2(420, y, 210, 56, G.campWon && next ? 'NÄCHSTES LEVEL' : 'NOCHMAL', { primary: 1, size: 20 })) { startCamp(G.campWon && next ? G.campI + 1 : G.campI); return; }
  if (btn2(650, y, 210, 56, 'WELT 1', { size: 22 })) { G.running = false; startAttract(); goScreen('camp'); }
}

// ---------- Hauptschleife ----------
let lastT = performance.now(), simAcc = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now; if (dt > .1) dt = .1; if (dt < 0) dt = 0; G.fdt = dt;
  try {
    try { musicTick(); } catch (e) { }
    pollNavPads();
    if (NET.role === 'client') { if (level && G.running) { clientFrame(dt); updateCam(dt); } }
    else if (G.running && !G.paused) {
      gatherInputs(dt); simAcc += dt * G.ts; let n = 0; while (simAcc >= STEP && n < 14 && G.running) { stepGame(STEP); simAcc -= STEP; n++; } if (n === 14) simAcc = 0;
      if (level) updateCam(dt);
    }
    if (NET.role === 'host' && G.running && !G.attract) netHostTick(dt);
    G.rdt = G.paused ? 0 : dt; G.alpha = NET.role === 'client' && G.screen === 'game' ? clamp(NET.acc / STEP, 0, 1) : G.paused || !G.running ? 1 : clamp(simAcc / STEP, 0, 1);
    renderWorld(G.rdt); drawUI(); endFrameInput(); G.errN = 0; if (!G.booted && (G.bootN = (G.bootN || 0) + 1) > 30) { G.booted = true; if (window.scSave && window.scSave.ready) window.scSave.ready(); }
  } catch (e) {
    console.error(e); G.errN = (G.errN || 0) + 1; try { for (let i = 0; i < 12; i++) ctx.restore(); } catch (e2) { }
    if (G.errN > 20) { G.errN = 0; try { netClose(); } catch (e2) { } try { G.paused = false; G.overlay = false; G.msg = 'Fehler abgefangen: ' + ((e && e.message) || e); goScreen('title'); startAttract(); } catch (e2) { } }
  }
  requestAnimationFrame(frame);
}
resize(); startAttract(); G.screen = 'splash'; requestAnimationFrame(frame);

</script>
